<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Снегоплан - проверка карты</title>
<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;font:12px system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;background:#f4f4ef}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab}
#p{position:absolute;top:6px;right:6px;background:#fffffff0;padding:5px 8px;border:1px solid #bbb;border-radius:6px;max-width:200px;font-size:11px;z-index:2}
#p.min .body{display:none}
#p b{cursor:pointer;user-select:none}
#p label{display:block;margin:2px 0;cursor:pointer}
#leg{margin-top:6px;font-size:12px}#leg span{display:inline-block;margin-right:8px;white-space:nowrap}
#leg i{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:3px;border:1px solid #888}
#tip{position:absolute;display:none;background:#222;color:#fff;padding:6px 8px;border-radius:5px;pointer-events:none;font-size:12px;line-height:1.45;max-width:300px}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="p"><b id="tg">[-] Снегоплан: карта</b><div class="body">
<label><input type="radio" name="m" value="zone" checked> Цвет по зонам</label>
<label><input type="radio" name="m" value="prio"> По приоритету</label>
<label><input type="radio" name="m" value="width"> По ширине (градиент)</label>
<label><input type="radio" name="m" value="wsrc"> По источнику ширины</label>
<label><input type="checkbox" id="hull"> Контуры зон</label>
<label><input type="checkbox" id="nod"> Узлы</label>
<label><input type="checkbox" id="sig"> Светофоры</label>
<div id="leg"></div><div style="margin-top:6px;color:#666">Колесо - масштаб, перетаскивание - сдвиг</div></div></div>
<div id="tip"></div>
<script>
const D=/*DATA*/null;
const ZC=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#008080","#9a6324","#808000","#f032e6"];
const PC={1:"#d7191c",2:"#2c7bb6",3:"#999999"},PN={1:"1 - магистрали/автобусные",2:"2 - именованные местные",3:"3 - дворовые/без имени"};
const WSC=["#1a9850","#2c7bb6","#fdae61","#d7191c","#7b3294"],WSN=D.wsn||["ширина из OSM (width)","из числа полос (lanes)","по умолчанию"];
const HN={primary:"primary",secondary:"secondary",tertiary:"tertiary",residential:"residential",unclassified:"unclassified",living_street:"living_street",primary_link:"primary_link",secondary_link:"secondary_link"};
const cv=document.getElementById("c"),cx=cv.getContext("2d"),tip=document.getElementById("tip");
let mode="zone",showHull=false,showNod=false,showSig=false;
const lat0=53.04,kx=Math.cos(lat0*Math.PI/180);
let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
const E=D.edges.map(a=>{const c=a[10],p=[];for(let i=0;i<c.length;i+=2){const x=c[i]*kx,y=-c[i+1];p.push(x,y);minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
 return {name:a[0],hw:a[1],lanes:a[2],w:a[3],ws:a[4],ls:a[5],zone:a[6],pr:a[7],two:a[8],len:a[9],p}});
let s=1,ox=0,oy=0;
function fit(){const W=W0||cv.clientWidth,H=H0||cv.clientHeight;s=Math.min(W/(maxx-minx),H/(maxy-miny))*0.95;ox=(W-(maxx-minx)*s)/2-minx*s;oy=(H-(maxy-miny)*s)/2-miny*s}
let dpr=1,W0=0,H0=0,touched=false;
function resize(){const wr=document.getElementById("wrap");let w=wr.clientWidth,h=wr.clientHeight;
 if(!w)w=innerWidth||document.documentElement.clientWidth||1000;if(!h)h=700;
 if(h<700&&!innerHeight)h=700;
 cv.style.width=w+"px";cv.style.height=h+"px";dpr=window.devicePixelRatio||1;
 cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);W0=w;H0=h}
function refit(){resize();if(!touched)fit();draw()}
function grad(w){const t=Math.max(0,Math.min(1,(w-3)/(18-3)));// 3 м жёлтый -> 18 м тёмно-синий
 const a=[255,237,160],b=[227,74,51],c=[8,48,107];const m=t<.5?[a,b,t*2]:[b,c,(t-.5)*2];
 return "rgb("+[0,1,2].map(i=>Math.round(m[0][i]+(m[1][i]-m[0][i])*m[2])).join(",")+")"}
function col(e){return mode=="zone"?ZC[e.zone-1]:mode=="prio"?PC[e.pr]:mode=="width"?grad(e.w):WSC[e.ws]}
function lw(e){return (e.pr==1?3.2:e.pr==2?2:1.3)*Math.min(2,Math.max(.6,s/60000))}
function draw(){cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.setTransform(dpr,0,0,dpr,0,0);cx.lineCap="round";cx.lineJoin="round";
 const order=[3,2,1];
 for(const pr of order){for(const e of E){if(e.pr!=pr)continue;cx.strokeStyle=col(e);cx.lineWidth=lw(e);cx.beginPath();
  for(let i=0;i<e.p.length;i+=2){const X=e.p[i]*s+ox,Y=e.p[i+1]*s+oy;i?cx.lineTo(X,Y):cx.moveTo(X,Y)}cx.stroke()}}
 if(showHull){D.hulls.forEach((h,k)=>{cx.strokeStyle=ZC[k];cx.lineWidth=2;cx.setLineDash([6,4]);cx.beginPath();
  h.forEach((q,i)=>{const X=q[0]*kx*s+ox,Y=-q[1]*s+oy;i?cx.lineTo(X,Y):cx.moveTo(X,Y)});cx.stroke();cx.setLineDash([]);
  let sx=0,sy=0;h.forEach(q=>{sx+=q[0];sy+=q[1]});cx.fillStyle=ZC[k];cx.font="bold 16px sans-serif";cx.fillText("Зона "+(k+1),sx/h.length*kx*s+ox-20,-sy/h.length*s+oy)})}
 if(showNod){for(const n of D.nodes){cx.fillStyle="#000";cx.fillRect(n[0]*kx*s+ox-1.5,-n[1]*s+oy-1.5,3,3)}}
 if(showSig&&D.signals){for(const q of D.signals){cx.fillStyle="#e6194b";cx.beginPath();cx.arc(q[0]*kx*s+ox,-q[1]*s+oy,3.5,0,7);cx.fill();cx.strokeStyle="#fff";cx.lineWidth=1;cx.stroke()}}
 for(const [id,t,c] of [[D.depot,"База","#000"],[D.dump,"Снегоотвал","#000"]]){const n=D.nodes[id];if(!n)continue}
 legend()}
function legend(){let h="";if(mode=="zone")ZC.forEach((c,i)=>h+=`<span><i style="background:${c}"></i>Зона ${i+1}</span>`);
 else if(mode=="prio")[1,2,3].forEach(p=>h+=`<span><i style="background:${PC[p]}"></i>${PN[p]}</span>`);
 else if(mode=="wsrc")WSC.forEach((c,i)=>h+=`<span><i style="background:${c}"></i>${WSN[i]}</span>`);
 else{h="Ширина проезжей части, м: ";[3,6,9,12,15,18].forEach(w=>h+=`<span><i style="background:${grad(w)}"></i>${w}${w==18?"+":""}</span>`)}
 document.getElementById("leg").innerHTML=h}
function dseg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));const qx=ax+t*dx-px,qy=ay+t*dy-py;return qx*qx+qy*qy}
function hit(mx,my){let best=null,bd=64;for(const e of E){for(let i=0;i<e.p.length-2;i+=2){const d=dseg(mx,my,e.p[i]*s+ox,e.p[i+1]*s+oy,e.p[i+2]*s+ox,e.p[i+3]*s+oy);if(d<bd||(d==bd&&best&&e.pr<best.pr)){bd=d;best=e}}}return best}
cv.addEventListener("mousemove",ev=>{if(drag){touched=true;ox+=ev.clientX-lx;oy+=ev.clientY-ly;lx=ev.clientX;ly=ev.clientY;draw();return}
 const e=hit(ev.clientX,ev.clientY);if(!e){tip.style.display="none";return}
 tip.innerHTML=`<b>${e.name||"(без названия)"}</b><br>тип: ${HN[e.hw]||e.hw}${e.two?"":", односторонняя"}<br>полос: ${e.lanes} (${(D.lsn||["OSM","по умолчанию"])[e.ls]})<br>ширина: ${e.w} м${e.two?" ("+(e.w/2)+" м на направление)":""}, источник: ${WSN[e.ws]}<br>зона: ${e.zone}, приоритет: ${e.pr}<br>длина: ${e.len} м`;
 tip.style.display="block";tip.style.left=Math.min(ev.clientX+14,innerWidth-310)+"px";tip.style.top=(ev.clientY+14)+"px"});
let drag=false,lx,ly;
cv.addEventListener("mousedown",ev=>{drag=true;lx=ev.clientX;ly=ev.clientY;cv.style.cursor="grabbing"});
addEventListener("mouseup",()=>{drag=false;cv.style.cursor="grab"});
cv.addEventListener("wheel",ev=>{ev.preventDefault();touched=true;const f=ev.deltaY<0?1.2:1/1.2;ox=ev.clientX-(ev.clientX-ox)*f;oy=ev.clientY-(ev.clientY-oy)*f;s*=f;draw()},{passive:false});
document.querySelectorAll("input[name=m]").forEach(r=>r.onchange=()=>{mode=r.value;draw()});
document.getElementById("hull").onchange=ev=>{showHull=ev.target.checked;draw()};
document.getElementById("nod").onchange=ev=>{showNod=ev.target.checked;draw()};
document.getElementById("sig").onchange=ev=>{showSig=ev.target.checked;draw()};
addEventListener("resize",refit);
if(window.ResizeObserver)new ResizeObserver(refit).observe(document.getElementById("wrap"));
document.getElementById("tg").onclick=()=>{const p=document.getElementById("p");p.classList.toggle("min");document.getElementById("tg").textContent=(p.classList.contains("min")?"[+]":"[-]")+" Снегоплан: карта"};
refit();setTimeout(refit,100);
</script></body></html>
