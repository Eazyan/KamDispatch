name: Traffic screenshot experiment

on:
  pull_request:
    paths:
      - 'monitoring/traffic_image.py'
      - 'scripts/capture_traffic.py'
      - 'scripts/evaluate_traffic.py'
      - 'tests/fixtures/traffic_annotations.json'
      - 'tests/test_traffic*.py'
      - 'requirements-traffic.txt'
      - '.github/workflows/traffic-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-traffic.txt
      - run: python -m pip install -r requirements-traffic.txt pytest==8.4.1
      - run: python -m pytest tests/test_traffic*.py -q
