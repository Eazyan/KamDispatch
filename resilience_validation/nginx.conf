server {
    listen 8080;
    client_max_body_size 14m;
    resolver 127.0.0.11 ipv6=off valid=2s;
    location ~ ^/api/v1/(city|health|operations|tiles|scenarios|runs|weather|drift-engine)(/|$) {
        set $city http://city-api:8008;
        proxy_pass $city;
        proxy_read_timeout 10s;
    }
    location = /public/dashboard {
        set $public http://public-dashboard:8090;
        proxy_pass $public/api/v1/dashboard;
    }
    location / {
        set $monitor http://api:8080;
        proxy_pass $monitor;
        proxy_read_timeout 20s;
    }
}
