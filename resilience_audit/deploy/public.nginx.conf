server {
    listen 8080;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    location = /api/v1/dashboard { proxy_pass http://public-dashboard:8090; proxy_read_timeout 20s; }
    location ~ ^/api/v1/(frames/[0-9a-f-]+|traffic|map/search|snow-roads|snow-raster/[^/]+)$ { proxy_pass http://api:8080; }
    location /city/ { proxy_pass http://city-web:8080/; }
    location /static/ { proxy_pass http://city-web:8080; }
    location = /drift-engine { proxy_pass http://city-web:8080; }
    location ~ ^/api/v1/(city|drift-engine|health|tiles|weather)(/|$) { proxy_pass http://city-web:8080; proxy_read_timeout 120s; }
    location ~ ^/api/v1/operations/(atlas|weather|network|city/catalog|city/runs|snow)(/|$) { proxy_pass http://city-web:8080; proxy_read_timeout 120s; }
    location = /healthz { proxy_pass http://api:8080; }
    location = / { add_header Cache-Control "no-store" always; proxy_pass http://api:8080; }
    location /assets/ { proxy_pass http://api:8080; }
    location = /favicon.ico { proxy_pass http://api:8080; }
    location / { return 404; }
}
