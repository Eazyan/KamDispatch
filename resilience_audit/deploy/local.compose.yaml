x-monitor: &monitor
  image: kamdispatch-resilience-monitor:win-1c3cdd8
  build: .
  environment:
    DATABASE_URL: "host=db port=5432 dbname=monitor user=monitor password=${POSTGRES_PASSWORD:?}"
    MONITOR_MODE: preview
    MEDIA_DIR: /app/runtime/media
    PUBLIC_URL: http://127.0.0.1:18088
    CITY_MAP_URL: http://127.0.0.1:18088/city/
    SNOW_CITY_REMOTE_URL: http://city-api:8008
    TRAFFIC_WORKER_URL: http://fixtures:8081
    OPENWEATHER_KEY: synthetic-key
    SSL_CERT_FILE: /certs/server.pem
    MONITOR_CAMERAS: /control/cameras.json
    BUS_RNIS_ENABLED: "0"
  volumes:
    - media:/app/runtime/media
    - ./runtime/demo:/app/runtime/demo:ro
    - ./runtime/citizens:/app/runtime/citizens:ro
    - ../certs:/certs:ro
    - ../control:/control:ro
  networks: [sandbox]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    networks: [sandbox]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, monitor, -d, monitor]
      interval: 3s
      timeout: 3s
      retries: 25
  api:
    <<: *monitor
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 4s
      timeout: 4s
      retries: 15
  worker:
    <<: *monitor
    command: [python, -m, monitoring.worker]
    depends_on:
      db:
        condition: service_healthy
      fixtures:
        condition: service_started
  city-api:
    image: kamdispatch-resilience-city:win-1c3cdd8
    build:
      context: ./city-sim
      dockerfile: Dockerfile.city-sim
    environment:
      CITY_SIM_DB: /state/city-sim.sqlite3
      CITY_SIM_WEATHER: /atlas-local/heatmaps
    networks: [sandbox]
    volumes:
      - city-state:/state
      - ./city-sim/weather_coverage:/atlas-local:ro
    healthcheck:
      test: [CMD, python, -c, "import json, urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8008/api/v1/health', timeout=4)); assert h['terrain_loaded'] and h['snow_solver_connected'], h"]
      interval: 5s
      timeout: 6s
      retries: 20
  city-web:
    image: kamdispatch-resilience-city-web:win-1c3cdd8
    build:
      context: ./city-sim
      dockerfile: Dockerfile.city-sim-web
    networks: [sandbox]
    volumes:
      - ./city-map:/usr/share/nginx/html/static/ops:ro
    depends_on:
      city-api:
        condition: service_healthy
  public-dashboard:
    image: kamdispatch-resilience-monitor:win-1c3cdd8
    command: [python, -m, uvicorn, "public_dashboard:app", --host, 0.0.0.0, --port, "8090"]
    networks: [sandbox]
    volumes:
      - ../public_dashboard.py:/app/public_dashboard.py:ro
    depends_on:
      api:
        condition: service_healthy
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:18088:8080"]
    networks: [sandbox, ingress]
    volumes:
      - ../../resilience_audit/deploy/public.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, city-web, public-dashboard]
  fixtures:
    image: kamdispatch-resilience-monitor:win-1c3cdd8
    command: [python, /fixtures.py]
    networks:
      sandbox:
        aliases: [api.openweathermap.org]
    volumes:
      - ../../resilience_audit/deploy/fixtures.py:/fixtures.py:ro
      - ../certs:/certs:ro
      - ../control:/control:ro

networks:
  sandbox:
    internal: true
  ingress: {}
volumes:
  postgres: {}
  media: {}
  city-state: {}
